services:
  - type: web
    name: dj-wood-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dj-wood-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: TRUST_PROXY
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: ""
      - key: JWT_TTL_SECONDS
        value: "43200"
      - key: DELIVERY_FEE_DZD
        value: "0"
      - key: FREE_DELIVERY_THRESHOLD_DZD
        value: "0"
databases:
  - name: dj-wood-db
    plan: basic-256mb
    databaseName: djwood
    user: djwood
